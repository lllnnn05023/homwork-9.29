<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图形hover效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a24;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 40px;
        }
        .item {
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 22px;
            /* 过渡：位移、阴影 */
            transition: all 0.3s ease;
            /* 默认阴影带偏移 */
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            /* hover文字默认隐藏 */
        }
        .item::after {
            content: "hover";
            opacity: 0;
            transition: opacity 0.3s;
        }
        /* hover状态：上移10px，阴影偏移变为0，文字显示 */
        .item:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px rgba(255,255,255,0.25);
        }
        .item:hover::after {
            opacity: 1;
        }

        /* 各个图形样式 */
        .box1 {
            background: linear-gradient(135deg, #ff8855, #ff5555);
            border-radius: 0; /* 正方形 */
        }
        .box2 {
            background: linear-gradient(135deg, #22dd88, #22ccaa);
            border-radius: 12px; /* 圆角矩形 */
        }
        .box3 {
            background: linear-gradient(135deg, #997799, #665588);
            border-radius: 24px; /* 大圆角方块 */
        }
        .box4 {
            background: linear-gradient(135deg, #ffcc66, #ff9977);
            border-radius: 50%; /* 圆形 */
        }
        .box5 {
            background: linear-gradient(135deg, #447766, #335566);
            border-radius: 16px;
        }
        .box6 {
            background: linear-gradient(135deg, #9977aa, #776699);
            border-radius: 50%; /* 圆形 */
        }
    </style>
</head>
<body>
    <div class="item box1"></div>
    <div class="item box2"></div>
    <div class="item box3"></div>
    <div class="item box4"></div>
    <div class="item box5"></div>
    <div class="item box6"></div>
</body>
</html>
